[package]
name = "teamsfast"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A native Microsoft Teams client for Linux (spike)"
repository = "https://github.com/YacineSahli/teamsfast"
keywords = ["teams", "microsoft", "chat", "egui"]
categories = ["gui"]

[lib]
name = "teamsfast"
path = "src/lib.rs"

[[bin]]
name = "teamsfast"
path = "src/main.rs"

[dependencies]
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# JWT payload decode for the self-id fallback.
base64 = "0.22"
# Encrypted local archive (chats + messages persisted across launches).
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
getrandom = "0.3"
# Timezone-aware timestamp formatting (server stamps are UTC).
jiff = "0.2"

# UI framework. Same choices as spotifast/zapfast: glow keeps the tree small.
eframe = { version = "0.36", default-features = false, features = [
    "accesskit", "glow", "default_fonts", "links", "wayland", "x11", "persistence",
] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["svg", "image"] }

# The Teams protocol core: our extraction of the patched ost library.
# Package is `teams-cli` upstream; the lib target is `ost`. SSH form because
# the repo is private and this machine's git auth is ssh-only.
ost = { git = "https://github.com/YacineSahli/teams-core", package = "teams-cli" }

# The fastframe UI stack: colour emoji, Inter + platform fonts, Lucide
# icons, editable themes, nicer wheel scrolling.
fastframe-emoji = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
fastframe-fonts = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
fastframe-icons = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
fastframe-text = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
fastframe-theme = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
fastframe-tray = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }

# Backend worker runtime (protocol calls + trouter live on a worker thread).
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

# Logging to stderr; the fastframe log file arrives in Phase 1.
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }

# Inline images: decode jpg/png/webp/gif from the core's media fetch.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# Desktop notifications (dbus) for incoming messages.
notify-rust = "4"
# Open downloaded files with the system handler.
open = "5"
# Native file dialog for attachments.
rfd = "0.15"

# Local development: build against the checked-out sibling instead of the
# pushed teams-core revision. Delete this block (then `cargo update`) to
# build against the pushed branch.
[patch."https://github.com/YacineSahli/teams-core"]
teams-cli = { path = "teams-core" }

[profile.release]
lto = "thin"
