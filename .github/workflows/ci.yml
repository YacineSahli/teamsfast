name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: build + test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev cmake perl
      - run: cargo build --locked
      - run: cargo test --locked
      - name: Version probe
        run: cargo run --locked -q -- --version | grep -qx "teamsfast $(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
