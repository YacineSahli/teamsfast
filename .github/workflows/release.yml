name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release-source:
    name: tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require the release commit on main
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release tags must point to a commit already on origin/main." >&2
            exit 1
          fi

  build:
    name: build (${{ matrix.target }})
    needs: release-source
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          # Native arm64 runner: no cross sysroot needed.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - name: Check release version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test "$GITHUB_REF_NAME" = "v$version"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev libdbus-1-dev cmake perl
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="teamsfast-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/teamsfast" "dist/$name/"
          cp README.md LICENSE THIRD-PARTY-NOTICES.md packaging/teamsfast-portable.txt "dist/$name/"
          cp --parents packaging/applications/teamsfast.desktop packaging/icons/teamsfast.svg contrib/omarchy/teamsfast.json.tpl "dist/$name/" || true
          cd dist
          tar czf "$name.tar.gz" "$name"
      - name: Attest release packages
        uses: crmne/native-packages/.github/actions/attest@999768410cf53cdc68c8679c09cb14de1a6bca7b # v0.8.1
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          merge-multiple: true
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: '3.4'
      - name: Sign update manifest
        uses: crmne/native-packages/.github/actions/sign-release@999768410cf53cdc68c8679c09cb14de1a6bca7b # v0.8.1
        with:
          directory: dist
          public-key: assets/update-public-key.hex
          key-env: TEAMSFAST_UPDATE_SIGNING_KEY
        env:
          TEAMSFAST_UPDATE_SIGNING_KEY: ${{ secrets.TEAMSFAST_UPDATE_SIGNING_KEY }}
      - name: Release notes
        run: |
          notes="packaging/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            cp "$notes" release-notes.md
          else
            echo "::error::Write $notes and push it before tagging a release."
            exit 1
          fi
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          name: TeamsFast ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: false
          make_latest: true
